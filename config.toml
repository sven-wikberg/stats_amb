# Fichier source produit par le nouvel outil. Les chemins relatifs sont résolus
# depuis ce fichier, ce qui permet de lancer le programme depuis un autre dossier.
[input]
path = "data/mai 26.csv"
delimiter = ";"

# Paramètres visibles dans le rapport. Pour un rapport annuel, utiliser
# mode = "annuel" et augmenter le seuil individuel (par exemple 100).
[report]
period_label = "Mai 2026"
mode = "mensuel"
output_dir = "output"
filename = "rapport_qualite - mai 2026.pdf"
minimum_person_interventions = 10

# Libellés conviviaux des codes de base du nouvel export Attrib.
[base_labels]
ACENITON = "Pierre-du-Niton"
ACEPERREAR = "Perréard"
ACECHENE = "Chêne"
